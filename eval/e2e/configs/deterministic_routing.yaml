name: deterministic_routing
description: Supervisor LLM disabled; routing uses the guards and the default order only. Synthetic wordings on (compare with `synthetic_wording`).
supervisor_llm: false
model: anthropic          # Claude (default | groq_only = OpenAI / Groq)
reranker: none
fresh_extraction: false  # reuse the extractions of the default run (routing does not touch them)
synthetic_wording: true
