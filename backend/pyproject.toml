[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpilot-backend"
version = "0.1.0"
description = "ClaimPilot backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pyyaml>=6",
  "bcrypt>=4",
  "pypdf>=4",
  "pymupdf>=1.24.3",
  "tiktoken>=0.7",
  "tenacity>=8.2",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.9",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  # preshed 3.0.14 breaks spaCy 3.8 model loading (OverflowError in Tokenizer._flush_specials)
  "preshed==3.0.10",
  "redis>=5.0.1",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-groq>=0.3",
  # Module 7: MCP servers + client. Pinned: langchain-mcp-adapters 0.3.x needs mcp 1.x.
  "mcp==1.30.0",
  "langchain-mcp-adapters==0.3.2",
  "jinja2>=3.1",
  # Module 8: agents. Pinned; the checkpointer talks to Postgres through psycopg 3.
  "langgraph==1.2.17",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
# Local cross-encoder reranker (RERANKER=local). Heavy: pulls torch. See Dockerfile build arg.
rerank-local = ["sentence-transformers>=3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "reportlab>=4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# repo root, so tests can import the top-level mcp_servers package
pythonpath = [".."]
# A hung async test (e.g. a never-answered MCP call) must fail, not block the whole suite.
timeout = 90

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from helper modules are 'redefined' by test parameters
"tests/*" = ["F811", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) would otherwise be mistaken for first-party code.
known-third-party = ["alembic"]
known-first-party = ["app", "eval", "mcp_servers"]
