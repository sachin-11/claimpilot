# Typical INR cost ranges per diagnosis (total hospital bill). Used to size generated
# bills and to define "unusually high" for risk scenarios. Fictional, rough estimates.
#
# kind: medical | surgical | daycare
# specific_wait_key  -> key in policy specific_disease_waiting
# sub_limit_key      -> key in policy sub_limits
# exclusion_tag      -> entry that must appear in policy exclusions to reject the claim
# ped_condition      -> pre-existing condition the admission is related to
# implant            -> implant line shown in the bill consumables

diagnoses:
  - key: dengue
    name: Dengue Fever with Thrombocytopenia
    icd10: A90
    kind: medical
    stay_days: [3, 6]
    cost_range: [35000, 140000]
    icu_probability: 0.1
    tests: [NS1 Antigen, Dengue IgM/IgG Serology, Platelet Count Serial, Complete Blood Count]

  - key: typhoid
    name: Enteric Fever (Typhoid)
    icd10: A01.0
    kind: medical
    stay_days: [3, 6]
    cost_range: [25000, 90000]
    icu_probability: 0.0
    tests: [Widal Test, Blood Culture, Complete Blood Count, Liver Function Test]

  - key: pneumonia
