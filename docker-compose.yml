services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimpilot}
      POSTGRES_DB: ${POSTGRES_DB:-claimpilot}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_LOCAL_RERANKER: ${INSTALL_LOCAL_RERANKER:-false}
        INSTALL_EVAL: ${INSTALL_EVAL:-true}
    env_file: .env
    environment:
      # File watching over a Docker Desktop bind mount is unreliable without polling.
      WATCHFILES_FORCE_POLLING: "true"
      # makes `python -m eval.rag.run_eval` importable (/eval is mounted above)
      PYTHONPATH: /app:/
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./data_gen:/data_gen:ro
      - ./eval:/eval
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
