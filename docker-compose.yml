x-mcp-env: &mcp-env
  PYTHONPATH: /app:/
  WRITE_ENABLED: "false"

x-mcp-server: &mcp-server
  # Same image as the backend service (build it with `docker compose build backend`).
  image: claimpilot-backend
  pull_policy: never
  env_file: .env
  environment: *mcp-env
  volumes:
    - ./backend:/app
    - ./data:/data
    - ./data_gen:/data_gen:ro
    - ./mcp_servers:/mcp_servers
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimpilot}
      POSTGRES_DB: ${POSTGRES_DB:-claimpilot}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_LOCAL_RERANKER: ${INSTALL_LOCAL_RERANKER:-false}
        INSTALL_EVAL: ${INSTALL_EVAL:-true}
    env_file: .env
    environment:
      # File watching over a Docker Desktop bind mount is unreliable without polling.
      WATCHFILES_FORCE_POLLING: "true"
      # makes `python -m eval.rag.run_eval` importable (/eval is mounted above)
      PYTHONPATH: /app:/
      # Agent runs, extraction and ingestion go to the worker (set USE_WORKER=false to run them in-process)
      USE_WORKER: ${USE_WORKER:-true}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./data_gen:/data_gen:ro
      - ./eval:/eval
      - ./mcp_servers:/mcp_servers
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- arq worker (Module 10): runs agent runs, extraction and ingestion off the API process ---
  worker:
    image: claimpilot-backend
    pull_policy: never
    env_file: .env
    environment:
      PYTHONPATH: /app:/
      USE_WORKER: "true"
    command: arq app.worker.settings.WorkerSettings
    restart: unless-stopped
    # SIGTERM: stop taking jobs, give the running ones WORKER_SHUTDOWN_WAIT_SECONDS (120) to finish;
    # whatever is still running is re-queued and continues from its checkpoint.
    stop_grace_period: 150s
    healthcheck:
      # a light check (no heavy imports): the worker refreshes this key every 5 seconds
      test:
        - CMD
        - python
        - -c
        - "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).exists('claimpilot:worker:health') else 1)"
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./data_gen:/data_gen:ro
      - ./mcp_servers:/mcp_servers
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- MCP servers (Module 7): same image as the backend, HTTP mode, bearer-token protected ---
  mcp-policy-docs:
    <<: *mcp-server
    command: python -m mcp_servers.policy_docs.server --transport http --host 0.0.0.0 --port 8101
    ports:
      - "${MCP_POLICY_DOCS_HOST_PORT:-8101}:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8101/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-claims-db:
    <<: *mcp-server
    command: python -m mcp_servers.claims_db.server --transport http --host 0.0.0.0 --port 8102
    environment:
      <<: *mcp-env
      WRITE_ENABLED: ${MCP_CLAIMS_DB_WRITE_ENABLED:-true}
    ports:
      - "${MCP_CLAIMS_DB_HOST_PORT:-8102}:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8102/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-notify:
    <<: *mcp-server
    command: python -m mcp_servers.notify.server --transport http --host 0.0.0.0 --port 8103
    environment:
      <<: *mcp-env
      WRITE_ENABLED: ${MCP_NOTIFY_WRITE_ENABLED:-true}
    ports:
      - "${MCP_NOTIFY_HOST_PORT:-8103}:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8103/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
